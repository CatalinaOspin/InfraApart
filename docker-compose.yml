# ============================================================
# InfraApart - Docker Compose
# Base de datos PostgreSQL + PostGIS Local
# ============================================================
#
# Uso:
#   docker compose up -d        # Levantar la base de datos
#   docker compose down         # Detener (sin borrar datos)
#   docker compose down -v      # Detener y borrar el volumen de datos
#
# El contenedor solo crea una base vacía con PostGIS disponible.
# Las tablas, índices y datos iniciales los crean las migraciones:
#   cd backend && npm run prisma:deploy

services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: infraapart_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: infraapart_db
      POSTGRES_USER: infraapart_user
      POSTGRES_PASSWORD: infraapart_password
      # Zona horaria (opcional)
      TZ: America/Bogota
      PGTZ: America/Bogota
    ports:
      - "5432:5432"
    volumes:
      # Volumen persistente: los datos sobreviven a docker compose down
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infraapart_user -d infraapart_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
    name: infraapart_postgres_data
